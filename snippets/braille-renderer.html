<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Braille 3D Renderer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B0E11;
      color: #F0F2F7;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas#braille-canvas {
      display: block;
      image-rendering: pixelated;
    }
    .controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .controls button {
      background: transparent;
      border: 1px solid #2F343D;
      color: #9DA4B1;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 8px 18px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .controls button:hover {
      background: rgba(240,242,247,0.06);
      color: #F0F2F7;
    }
    .controls button.active {
      border-color: #F0F2F7;
      color: #F0F2F7;
    }
  </style>
</head>
<body>

  <canvas id="braille-canvas"></canvas>

  <div class="controls">
    <button class="active" data-shape="torus">torus</button>
    <button data-shape="cube">cube</button>
    <button data-shape="prism">prism</button>
    <button data-shape="sphere">sphere</button>
  </div>

  <script>
  /* ── Braille 3D Renderer ────────────────────────────────── */
  (() => {
    const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
    const BIT = [1,8,2,16,4,32,64,128];

    const SHAPES = {
      torus: () => {
        const pts = [];
        for (let i = 0; i < 60; i++) {
          const a = (i / 60) * Math.PI * 2;
          for (let j = 0; j < 30; j++) {
            const b = (j / 30) * Math.PI * 2;
            const R = 1.4, r = 0.55;
            pts.push({
              x: (R + r * Math.cos(b)) * Math.cos(a),
              y: (R + r * Math.cos(b)) * Math.sin(a),
              z: r * Math.sin(b)
            });
          }
        }
        return pts;
      },
      cube: () => {
        const pts = [];
        const N = 18;
        const faces = [
          { n: [1,0,0], u: [0,1,0], v: [0,0,1] },
          { n: [-1,0,0], u: [0,1,0], v: [0,0,1] },
          { n: [0,1,0], u: [1,0,0], v: [0,0,1] },
          { n: [0,-1,0], u: [1,0,0], v: [0,0,1] },
          { n: [0,0,1], u: [1,0,0], v: [0,1,0] },
          { n: [0,0,-1], u: [1,0,0], v: [0,1,0] }
        ];
        for (const f of faces) {
          for (let i = 0; i < N; i++) {
            for (let j = 0; j < N; j++) {
              const u = (i / (N-1)) * 2 - 1;
              const v = (j / (N-1)) * 2 - 1;
              pts.push({
                x: f.n[0] + u*f.u[0] + v*f.v[0],
                y: f.n[1] + u*f.u[1] + v*f.v[1],
                z: f.n[2] + u*f.u[2] + v*f.v[2]
              });
            }
          }
        }
        return pts;
      },
      prism: () => {
        const pts = [];
        const sides = 8, hStacks = 40;
        for (let i = 0; i < sides; i++) {
          const a1 = (i / sides) * Math.PI * 2;
          const a2 = ((i + 1) / sides) * Math.PI * 2;
          for (let j = 0; j < hStacks; j++) {
            const t1 = (j / hStacks) * 2 - 1;
            const t2 = ((j + 1) / hStacks) * 2 - 1;
            pts.push({ x: Math.cos(a1), y: t1, z: Math.sin(a1) });
            pts.push({ x: Math.cos(a2), y: t2, z: Math.sin(a2) });
          }
        }
        for (let i = 0; i < 400; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random());
          pts.push({ x: r * Math.cos(a), y: 1, z: r * Math.sin(a) });
          pts.push({ x: r * Math.cos(a), y: -1, z: r * Math.sin(a) });
        }
        return pts;
      },
      sphere: () => {
        const pts = [];
        for (let i = 0; i < 40; i++) {
          const lat = (i / 40) * Math.PI;
          for (let j = 0; j < 60; j++) {
            const lon = (j / 60) * Math.PI * 2;
            const r = 1.2;
            pts.push({
              x: r * Math.sin(lat) * Math.cos(lon),
              y: r * Math.cos(lat),
              z: r * Math.sin(lat) * Math.sin(lon)
            });
          }
        }
        return pts;
      }
    };

    const cache = {};
    for (const [k, fn] of Object.entries(SHAPES)) cache[k] = fn();

    const canvas = document.getElementById('braille-canvas');
    const ctx = canvas.getContext('2d');

    let currentShape = 'torus';

    document.querySelectorAll('.controls button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.controls button.active')?.classList.remove('active');
        btn.classList.add('active');
        currentShape = btn.dataset.shape;
      });
    });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;
    }
    resize();
    window.addEventListener('resize', resize);

    let lastT = 0;
    const INTERVAL = 1000 / 24;

    function render(time) {
      const t = time * 0.001;
      const rx = t * 0.3, ry = t * 0.5;
      const crx = Math.cos(rx), srx = Math.sin(rx);
      const cry = Math.cos(ry), sry = Math.sin(ry);

      const points = cache[currentShape];
      if (!points) return;

      const w = canvas.width, h = canvas.height;
      if (!w || !h) return;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#F0F2F7';
      ctx.font = '10px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const cw = 6, ch = 11;
      const cols = Math.floor(w / cw);
      const rows = Math.floor(h / ch);
      if (cols < 2 || rows < 2) return;
      const sc = Math.min(cols, rows) * 0.45;
      const buf = new Float32Array(cols * 2 * rows * 4);

      for (const p of points) {
        let x1 = p.x * cry - p.z * sry;
        let z1 = p.x * sry + p.z * cry;
        let y1 = p.y * crx - z1 * srx;
        let z2 = p.y * srx + z1 * crx;
        const sx = Math.floor(x1 * sc + cols);
        const sy = Math.floor(y1 * sc + rows * 2);
        const bright = (z2 + 2) * 0.3;
        if (sx > 0 && sx < cols * 2 - 1 && sy > 0 && sy < rows * 4 - 1) {
          buf[sy * cols * 2 + sx] += bright;
        }
      }

      let maxV = 0;
      for (let i = 0; i < buf.length; i++) if (buf[i] > maxV) maxV = buf[i];
      if (maxV > 0) for (let i = 0; i < buf.length; i++) buf[i] /= maxV;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let code = 0x2800;
          let hasDot = false;
          for (let dy = 0; dy < 4; dy++) {
            for (let dx = 0; dx < 2; dx++) {
              const sx = c * 2 + dx, sy = r * 4 + dy;
              const val = buf[sy * cols * 2 + sx];
              const thr = BAYER[(sy % 4) * 4 + (sx % 4)] / 16;
              if (val > thr * 0.5) {
                code |= BIT[dy * 2 + dx];
                hasDot = true;
              }
            }
          }
          if (hasDot) {
            ctx.fillText(String.fromCharCode(code), c * cw + cw/2, r * ch + ch/2);
          }
        }
      }
    }

    function loop(t) {
      requestAnimationFrame(loop);
      if (t - lastT >= INTERVAL) { lastT = t; render(t); }
    }
    requestAnimationFrame(loop);
  })();
  </script>

</body>
</html>
