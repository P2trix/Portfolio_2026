<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IvyCoin — Patryk Wenda</title>
  <link rel="stylesheet" href="../css/case-study.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    /* ─── IvyCoin page vars ─── */
    .iv-page {
      --cs-bg: #06060F;
      --cs-text: #ffffff;
      --cs-text-muted: #8B8FA8;
      --cs-border: #1E1E2E;
      --cs-accent: #7C5CFC;
      background: #06060F;
      color: #ffffff;
    }
    .iv-page .cs-nav {
      background: rgba(6,6,15,0.85);
      border: 1px solid rgba(124,92,252,0.15);
      backdrop-filter: blur(16px);
    }
    .iv-page .cs-nav--sticky {
      background: rgba(6,6,15,0.9);
      backdrop-filter: blur(20px);
      border-color: rgba(124,92,252,0.2);
    }
    .iv-page .cs-nav__logo,
    .iv-page .cs-nav__links a { color: #fff; }
    .iv-page .cs-nav__links a:hover { color: #7C5CFC; }
    .iv-page .cs-nav__cv {
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }
    .iv-page .cs-nav__cv:hover {
      background: #7C5CFC;
      border-color: #7C5CFC;
      color: #fff;
    }

    /* ─── Grainy Gradient CTA ─── */
    .iv-orbs-section {
      position: relative;
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 80px 0 0;
      border-radius: 32px;
      background:
        radial-gradient(ellipse 70% 90% at -10% 50%, rgba(124,92,252,0.85) 0%, transparent 65%),
        radial-gradient(ellipse 60% 80% at 108% 35%, rgba(96,165,250,0.75) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 50% 110%, rgba(192,132,252,0.55) 0%, transparent 55%),
        #06060F;
    }

    /* SVG noise grain overlay — exact params from aayushbharti.in */
    .iv-orbs-section::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 1;
      opacity: 0.03;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .iv-orbs-section::after { display: none; }

    .iv-orbs-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 80px 24px;
      max-width: 800px;
    }

    .iv-orbs-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7C5CFC;
      margin: 0 0 24px;
    }

    .iv-orbs-heading {
      font-family: 'Onest', sans-serif;
      font-size: clamp(2.4rem, 6vw, 5rem);
      font-weight: 700;
      line-height: 1.05;
      color: #ffffff;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }

    .iv-orbs-heading span {
      background: linear-gradient(90deg, #7C5CFC 0%, #C084FC 50%, #F59E0B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .iv-orbs-sub {
      font-size: 1.1rem;
      line-height: 1.6;
      color: rgba(255,255,255,0.5);
      margin: 0 0 48px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    .iv-cta-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .iv-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: #7C5CFC;
      color: #fff;
      border-radius: 1000px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 32px rgba(124,92,252,0.35);
    }
    .iv-btn-primary:hover {
      background: #6A47F0;
      transform: translateY(-2px);
      box-shadow: 0 4px 40px rgba(124,92,252,0.55);
    }

    .iv-btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      border-radius: 1000px;
      border: 1px solid rgba(255,255,255,0.12);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .iv-btn-ghost:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.25);
    }

    /* ─── footer gap ─── */
    .iv-spacer { height: 80px; }
  </style>
</head>
<body class="cs-page iv-page">

  <!-- Nav -->
  <nav class="cs-nav">
    <div class="container">
      <a href="../index.html" class="cs-nav__logo">
        <span class="cs-nav__logo-icon">
          <span class="gradient"></span>
          <span class="dot"></span>
        </span>
        Patryk Wenda
      </a>
      <button class="cs-nav__toggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="cs-nav__links">
        <div class="cs-nav__links-inner">
          <a href="../index.html#about">About</a>
          <a href="../index.html#work">Work</a>
          <a href="../index.html#contact">Kontakt</a>
          <a href="https://framerusercontent.com/assets/TnGNlhYU6wVWDDhgpsmIg30DjM.pdf" target="_blank" class="cs-nav__cv">Download my CV</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- IvyCoin graphic -->
  <div class="container" data-reveal>
    <img src="../Figma/Ivycoin/IVY.png" alt="IvyCoin ICO Platform" style="width:100%;display:block">
  </div>

  <!-- Gradient Orbs CTA Section -->
  <div class="container">
    <div class="iv-orbs-section" data-reveal>

      <div class="iv-orbs-content">
        <p class="iv-orbs-eyebrow">__ Get in touch</p>
        <h2 class="iv-orbs-heading">
          FROM CONCEPT<br>TO <span>CREATION</span>
        </h2>
        <p class="iv-orbs-sub">Let's work together on your next project. I'm available for full-time roles & freelance work.</p>
        <div class="iv-cta-row">
          <a href="mailto:wendapatryk91@gmail.com" class="iv-btn-primary">
            Get in touch
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <a href="https://www.linkedin.com/in/patrykwenda91/" target="_blank" class="iv-btn-ghost">LinkedIn</a>
        </div>
      </div>
    </div>
  </div>

  <div class="iv-spacer"></div>


</body>
</html>
