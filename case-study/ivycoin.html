    /* ─── Grainy Gradient CTA ─── */
    .iv-orbs-section {
      position: relative;
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 80px 0 0;
      border-radius: 32px;
      background:
        radial-gradient(ellipse 70% 90% at -10% 50%, rgba(124,92,252,0.85) 0%, transparent 65%),
        radial-gradient(ellipse 60% 80% at 108% 35%, rgba(96,165,250,0.75) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 50% 110%, rgba(192,132,252,0.55) 0%, transparent 55%),
        #06060F;
    }

    /* SVG noise grain overlay — exact params from aayushbharti.in */
    .iv-orbs-section::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 1;
      opacity: 0.03;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .iv-orbs-section::after { display: none; }

    .iv-orbs-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 80px 24px;
      max-width: 800px;
    }

    .iv-orbs-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7C5CFC;
      margin: 0 0 24px;
    }

    .iv-orbs-heading {
      font-family: 'Onest', sans-serif;
      font-size: clamp(2.4rem, 6vw, 5rem);
      font-weight: 700;
      line-height: 1.05;
      color: #ffffff;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }

    .iv-orbs-heading span {
      background: linear-gradient(90deg, #7C5CFC 0%, #C084FC 50%, #F59E0B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .iv-orbs-sub {
      font-size: 1.1rem;
      line-height: 1.6;
      color: rgba(255,255,255,0.5);
      margin: 0 0 48px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    .iv-cta-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .iv-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: #7C5CFC;
      color: #fff;
      border-radius: 1000px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 32px rgba(124,92,252,0.35);
    }
    .iv-btn-primary:hover {
      background: #6A47F0;
      transform: translateY(-2px);
      box-shadow: 0 4px 40px rgba(124,92,252,0.55);
    }

    .iv-btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      border-radius: 1000px;

      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;

    .iv-btn-ghost:hover {

      border-color: rgba(255,255,255,0.25);
    }

  <!-- Contact mosaic shader -->
  <script>
  (function () {
    var wrap = document.getElementById('contact-shader-wrap');
    var mount = document.getElementById('contact-shader-mount');
    if (!mount || !wrap) return;

    var vertexShader = [
      'varying vec2 vUv;',
      'void main() {',
      '  vUv = uv;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n');

    var fragmentShader = [
      'precision highp float;',
      'uniform vec2 resolution;',
      'uniform float time;',
      '',
      'float random (vec2 st) {',
      '  return fract(sin(dot(st.xy, vec2(12.9898,78.233)))*43758.5453123);',
      '}',
      '',
      'varying vec2 vUv;',
      'void main(void) {',
      '  vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);',
      '  vec2 fMosaicScal = vec2(4.0, 2.0);',
      '  vec2 vScreenSize = vec2(48.0, 48.0);',
      '  uv.x = floor(uv.x * vScreenSize.x / fMosaicScal.x) / (vScreenSize.x / fMosaicScal.x);',
      '  uv.y = floor(uv.y * vScreenSize.y / fMosaicScal.y) / (vScreenSize.y / fMosaicScal.y);',
      '',
      '  float t = time * 0.06 + random(uv) * 0.4;',
      '  float lineWidth = 0.0008;',
      '',
      '  vec3 cardBg = vec3(0.965, 0.973, 1.0);',
      '  vec3 color = cardBg;',
      '  vec3 ringColor = vec3(0.0);',
      '  for (int j = 0; j < 3; j++) {',
      '    for (int i = 0; i < 5; i++) {',
      '      ringColor[j] += lineWidth * float(i * i) / abs(fract(t - 0.01 * float(j) + float(i) * 0.01) * 1.0 - length(uv));',
      '    }',
      '  }',
      '  ringColor = clamp(ringColor * 0.15, 0.0, 1.0);',
      '',
      '  vec3 accent = vec3(0.110, 0.306, 0.996);',
      '  vec3 teal = vec3(0.0, 0.918, 0.894);',
      '  vec3 tint = mix(accent, teal, ringColor.g);',
      '  color = mix(cardBg, tint, ringColor.r * 0.5 + ringColor.b * 0.5);',
      '',
      '  gl_FragColor = vec4(color, 1.0);',
      '}'
    ].join('\n');

    var uniforms = {
      resolution: { value: new THREE.Vector2() },
      time:       { value: 0.0 }
    };

    var scene    = new THREE.Scene();
    var camera   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var geometry = new THREE.PlaneGeometry(2, 2);
    var material = new THREE.ShaderMaterial({
      uniforms:       uniforms,
      vertexShader:   vertexShader,
      fragmentShader: fragmentShader,
    });
    var mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    var renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    mount.appendChild(renderer.domElement);

    function resize() {
      var w = wrap.clientWidth;
      var h = wrap.clientHeight;
      if (w === 0 || h === 0) return;
      renderer.setSize(w, h);
      uniforms.resolution.value.set(renderer.domElement.width, renderer.domElement.height);
    }
    resize();

    var ro = new ResizeObserver(resize);
    ro.observe(wrap);

    function animate() {
      requestAnimationFrame(animate);
      uniforms.time.value += 0.05;
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
